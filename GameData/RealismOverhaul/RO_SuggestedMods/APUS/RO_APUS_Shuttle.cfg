@PART[APUScockpit1]:NEEDS[APUS_Shuttle]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	%rescaleFactor = 1.6
	%specLevel = althist
	@manufacturer = #roMfrGeneric
	&tags =
	@tags ^= :$: APUS shuttle spaceplane:

	@title = Light Spaceplane Cockpit
	@description = Three-seat flight deck for a light spaceplane. Carries the avionics, power storage and life support for short orbital sorties.
	@mass = 2.8

	%skinTempTag = HRSI
	%internalTempTag = Instruments
	%skinTempOverride = 2000
	%skinInsulationTag = True
	%paintEmissivityTag = 0.95

	%ROLSTankStorage = 15

	!MODULE[ModuleLiftingSurface] {}
	!MODULE[ModuleReactionWheel] {}
	!RESOURCE,* {}

	@MODULE[ModuleCommand]
	{
		@minimumCrew = 0
		!RESOURCE,* {}
		RESOURCE
		{
			name = ElectricCharge
			rate = 1.0
		}
	}

	MODULE
	{
		name = ModuleFuelTanks
		type = ServiceModule
		volume = 1500
		basemass = -1

		TANK
		{
			name = ElectricCharge
			amount = 15000
			maxAmount = 15000
		}
	}
}

