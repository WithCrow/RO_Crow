// Buran Orbiter Construction Kit
// Disclaimer: Most of this is a copy of DECQs Buran mod
// Buran parts only. A bare benjee10_shuttle* would also hit the SOCK Space Shuttle parts
@PART[benjee10_shuttle_buran*|benjee10_buran*|benjee10_Buran*]:FOR[RealismOverhaul]
{
	@manufacturer = NPO Energia
}

// Clone the shared Shuttle parts into Buran variants before SOCK (RO_ShuttleOV.cfg) patches the originals,
// so the clones always start from the unpatched parts regardless of file load order.
// They are configured by name in the FOR[RealismOverhaul] blocks below.
+PART[benjee10_shuttle_deltaWing]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_deltawing
}
+PART[benjee10_shuttle_deltaWing]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_deltaWing_right
}
+PART[benjee10_shuttle_rudder]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_rudder
}
+PART[benjee10_shuttle_elevon1]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_elevon1
}
+PART[benjee10_shuttle_elevon2]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_elevon2
}
+PART[benjee10_shuttle_mainGear]:BEFORE[RealismOverhaul]
{
	@name = benjee10_buran_maingear
}
// Orbiter configs
@PART[benjee10_shuttle_buranCockpit]:FOR[RealismOverhaul]
{
	@title = 1K Orbiter Forward Fuselage
	%RSSROConfig = True
	
	@rescaleFactor = 1.81
	%CoMOffset = 0.0, -0.5, 0.0
	@mass = 8.556
	
	@maxTemp = 773
	%skinMaxTemp = 2000
	%heatConductivity = 0.01		//all conductivity
	%skinInternalConductionMult = 0.005	//skin-to-int conductivity
	%skinSkinConductionMult = 0.1
	%emissiveConstant = 0.95		//matte black

	!RESOURCE[MonoPropellant]{}
	!MODULE[ModuleReactionWheel]{}
	!MODULE[ModuleLiftingSurface]{}
	
	@MODULE[ModuleCommand]
	{
		RESOURCE
		{
			//Assuming same as STS
			// https://www.buran-energia.com/documentation/documentation-akc-power-unit.php
			name = ElectricCharge
			rate = 14 //Average power draw of orbiter
		}
	}

	// Buran RCS runs on Syntin/LOX, not the Shuttle's MMH/NTO. Tank loads are carried over from the DECQ Buran config
	// (1000 kg of the 14500 kg Syntin/LOX total is in the fore tanks: 307.7 L Syntin, 647.3 L LOX)
	// Primary RCS thrust : 3.92 kN (400 kgf), ISP ~295 (same as DECQ Buran)
	// RCS patch at the bottom of the file

	// https://www.bernd-leitenberger.de/space-shuttle.shtml
	// three nickel-cadmium batteries with 10 amperehours each at 28 volts, so in total 3024 kJ
	// (Shuttle figure, assumed same for Buran as in the DECQ config)
	MODULE
	{
		name = ModuleFuelTanks
		volume = 4000
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = Syntin
			amount = 307.7
			maxAmount = 307.7
		}
		TANK
		{
			name = LqdOxygen
			amount = 647.3
			maxAmount = 647.3
		}
		TANK
		{
			name = ElectricCharge
			amount = 3024
			maxAmount = 3024
		}
	}
}

// Cockpit internal configuration
@INTERNAL[OV_shuttleIVA]:FOR[RealismOverhaul]
{
	%scaleAll = 1.78, 1.78, 1.78

	@MODULE[InternalSeat],*
	{
		%kerbalScale = 1.78, 1.78, 1.78
		%kerbalOffset = 0.0, 0.0, 0.0
		%kerbalEyeOffset = 0.0, 0.0, 0.0
	}
}

@PART[benjee10_Buran_midFuselage]:FOR[RealismOverhaul]
{
	@title = 1K Orbiter Mid Fuselage
	%RSSROConfig = True
	
	@rescaleFactor = 1.81
	%CoMOffset = 0.0, -1.0, 0.0
	%CoLOffset = 0,1.2,0
	@mass = 17.806
	
	@maxTemp = 773
	%skinMaxTemp = 2000
	%heatConductivity = 0.01		//all conductivity
	%skinInternalConductionMult = 0.005	//skin-to-int conductivity
	%skinSkinConductionMult = 0.1
	%emissiveConstant = 0.95		//matte black

	%rescaleCube = true

	@DRAG_CUBE
	{
		%rescaleX = 1.81
		%rescaleY = 1.81
		%rescaleZ = 1.81
	}

	!MODULE[ModuleResourceConverter]{}
	!RESOURCE[*],* {}
	%fuelCrossFeed = True

	@MODULE[ModuleLiftingSurface]
	{
		%deflectionLiftCoeff = 20.0
		%dragAtMaxAoA = 0.1
	}

	//maximum heat rejection capacity of 29,000 Btu per hour (8.5 kW)
	//https://spaceflight.nasa.gov/shuttle/reference/shutref/orbiter/eclss/atcs.html
	//values are copied from stock radiators, since I don't know what they are for
	MODULE
	{
		name = ModuleActiveRadiator
		maxEnergyTransfer = 8.5
		overcoolFactor = 0.25
		isCoreRadiator = true
		parentCoolingOnly = true
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.9
		}
	}

	//https://www.bernd-leitenberger.de/space-shuttle.shtml
	// 3 Hydrogen tanks with 42 kg (593.2 L) each, and 3 Oxygen tanks with 354 kg (310.2 L) each.
	// These tanks also provide Oxygen and Hydrogen to life support. (51 kg)
	MODULE
	{
		name = ModuleFuelTanks
		volume = 2710.3
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = Hydrogen
			amount = 1779.6
			maxAmount = 1779.6
		}
		TANK
		{
			name = Oxygen
			amount = 930.7
			maxAmount = 930.7
		}
	}
}

@PART[benjee10_shuttle_buranOMS]:FOR[RealismOverhaul]
{
	@title = 1K Orbiter OMS
	%RSSROConfig = True
	
	@rescaleFactor = 1.81
	%CoMOffset = 0.0, -1, 0.0
	@mass = 15.7
	
	@maxTemp = 773
	%skinMaxTemp = 2000
	%heatConductivity = 0.01		//all conductivity
	%skinInternalConductionMult = 0.005	//skin-to-int conductivity
	%skinSkinConductionMult = 0.1
	%emissiveConstant = 0.95		//matte black
	
	!RESOURCE[*],* {}
	!MODULE[ModuleReactionWheel]{}
	!NODE[node_stack_Rudder] {}	//Remove rudder node, we're making the rudder surface attach to hopefully please FAR
	
	// https://ueip.org/photon-fuel-cell-generator-space-system.htm#gsc.tab=0
	// four fuel cells, 10 kW each (40 kW total)
	// reactant and water flows are scaled to the 10 kW output, same conversion efficiency as the SOCK/DECQ 7 kW cells
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fuel Cell #1
		StartActionName = Start Fuel Cell #1
		StopActionName = Stop Fuel Cell #1
		ToggleActionName = Toggle Fuel Cell #1
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False
		
		INPUT_RESOURCE
		{
			ResourceName = Hydrogen
			Ratio = 0.002456
		}

		INPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 0.001221
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 10
			DumpExcess = False
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.001667
			DumpExcess = True
		}
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fuel Cell #2
		StartActionName = Start Fuel Cell #2
		StopActionName = Stop Fuel Cell #2
		ToggleActionName = Toggle Fuel Cell #2
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False
		
		INPUT_RESOURCE
		{
			ResourceName = Hydrogen
			Ratio = 0.002456
		}

		INPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 0.001221
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 10
			DumpExcess = False
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.001667
			DumpExcess = True
		}
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fuel Cell #3
		StartActionName = Start Fuel Cell #3
		StopActionName = Stop Fuel Cell #3
		ToggleActionName = Toggle Fuel Cell #3
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False
		
		INPUT_RESOURCE
		{
			ResourceName = Hydrogen
			Ratio = 0.002456
		}

		INPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 0.001221
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 10
			DumpExcess = False
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.001667
			DumpExcess = True
		}
	}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fuel Cell #4
		StartActionName = Start Fuel Cell #4
		StopActionName = Stop Fuel Cell #4
		ToggleActionName = Toggle Fuel Cell #4
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False
		
		INPUT_RESOURCE
		{
			ResourceName = Hydrogen
			Ratio = 0.002456
		}

		INPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 0.001221
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 10
			DumpExcess = False
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.001667
			DumpExcess = True
		}
	}


	//should have three APU's for launch/entry power and hydraulics, modelled as one converter
	//fed from the Hydrazine tank below (537.8 L in total, same as the DECQ Buran config)
	//https://spaceflight.nasa.gov/shuttle/reference/shutref/orbiter/apu/
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Auxiliary Power Unit
		StartActionName = Start APU
		StopActionName = Stop APU
		ToggleActionName = Toggle APU
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False

		INPUT_RESOURCE
		{
			ResourceName = Hydrazine
			Ratio = 0.21
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 15
			DumpExcess = False
		}
	}

	//OMS/RCS
	// Total fuel load 14500 kg of Syntin and LOX, carried over from the DECQ Buran config:
	// 1000 kg in fore tanks, 13500 kg in aft tanks: 4154.3 L Syntin, 8738.7 L LOX
	// Primary RCS thrust : 3.92 kN (400 kgf), ISP ~295
	// RCS patch at the bottom of the file
	// The 13430.8 L volume is Syntin + LOX + 537.8 L of Hydrazine for the APU
	MODULE
	{
		name = ModuleFuelTanks
		volume = 13430.8
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = Syntin
			amount = 4154.3
			maxAmount = 4154.3
		}
		TANK
		{
			name = LqdOxygen
			amount = 8738.7
			maxAmount = 8738.7
		}
		TANK
		{
			name = Hydrazine
			amount = 537.8
			maxAmount = 537.8
		}
		//backup batteries in aft compartment. Assumed same capacity as primary batteries
		TANK
		{
			name = ElectricCharge
			amount = 3024
			maxAmount = 3024
		}
	}
}

// Wings
// The wing mesh is the Shuttle delta wing, so the FAR geometry is the SOCK/DECQ delta wing one
@PART[benjee10_buran_deltawing]:FOR[RealismOverhaul]
{
	@title = 1K Orbiter Delta Wing (left)
	%RSSROConfig = True
	
	@rescaleFactor = 1.81
	%CoMOffset = 0.5, -1.0 , 0.0
	@mass = 2.9
	
	@maxTemp = 773
	%skinMaxTemp = 2000
	%heatConductivity = 0.01		//all conductivity
	%skinInternalConductionMult = 0.005	//skin-to-int conductivity
	%skinSkinConductionMult = 0.1
	%emissiveConstant = 0.95		//matte black
	
	@dragModelType = override	//I'm not sure if this does anything, but I don't wanna tempt fate by removing it
	@maximum_drag = 0
	@minimum_drag = 0
	@angularDrag = 0

	!MODULE[ModuleLiftingSurface]{}
	%MODULE[FARWingAerodynamicModel]
	{
		%MAC = 12.06
		%MidChordSweep = 33.6
		%b_2 = 8.95
		%TaperRatio = 0.185
		%rootMidChordOffsetFromOrig = 0, 2.0, -2.0
		%massOverride = 0
	}
	!NODE[wingL] {}
	!NODE[elevon2R] {}
	!NODE[elevon1R] {}
	!NODE[GearR] {}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[wing]]
	{
		!SUBTYPE[Right] {}
	}
	%MODULE[ModuleB9DisableTransform]
	{
		transform = OV_deltaWingR
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[texture]]
	{
		!SUBTYPE[shuttle] {}
	}
}

